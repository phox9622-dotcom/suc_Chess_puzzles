<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Puzzles</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            background: #2c3e50;
            min-height: 100vh;
            margin: 0;
        }
        #app {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            background: #ecf0f1;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
        .bar { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        #board {
            display: grid;
            grid-template-columns: repeat(8, 55px);
            grid-template-rows: repeat(8, 55px);
            border: 4px solid #1a1a1a;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }
        .sq {
            width: 55px;
            height: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            border: none;
            cursor: pointer;
            padding: 0;
            font-family: inherit;
        }
        /* ألوان متباينة جداً */
        .sq.light { background: #f0d9b5; }
        .sq.dark  { background: #6b4423; }
        .sq.sel   { background: #ffeb3b !important; }
        .sq.hint  { background: #ff9800 !important; }
        .sq.target{ background: #8bc34a !important; }
        
        .btn {
            padding: 10px 18px;
            cursor: pointer;
            border: 1px solid #34495e;
            border-radius: 6px;
            background: #fff;
            font-size: 14px;
            font-weight: bold;
        }
        .btn:hover { background: #3498db; color: white; }
        select {
            padding: 8px;
            border-radius: 6px;
            font-size: 14px;
            border: 1px solid #34495e;
        }
        #status, #score {
            font-size: 18px;
            font-weight: bold;
            color: #2c3e50;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <div id="app" hidden></div>
    <script type="module" src="main.js"></script>
</body>
</html>
